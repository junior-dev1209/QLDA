<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>B&#7841;n kh&#244;ng th&#7875; xem n&#7897;i dung n&#224;y</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f0f2f5;
      color: #1c1e21;
    }
    main {
      width: min(520px, calc(100% - 32px));
      text-align: center;
      padding: 32px 24px;
    }
    .file-lock {
      width: 78px;
      height: 78px;
      margin: 0 auto 24px;
      position: relative;
    }
    .file {
      position: absolute;
      right: 5px;
      top: 0;
      width: 48px;
      height: 62px;
      border-radius: 6px;
      background: linear-gradient(145deg, #42a5f5, #1877f2);
      box-shadow: 0 8px 20px rgba(24, 119, 242, .18);
    }
    .file::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      border-left: 14px solid transparent;
      border-bottom: 14px solid rgba(255, 255, 255, .72);
    }
    .lock {
      position: absolute;
      left: 3px;
      bottom: 0;
      width: 48px;
      height: 36px;
      border-radius: 6px;
      background: #5f6368;
    }
    .lock::before {
      content: "";
      position: absolute;
      left: 11px;
      top: -19px;
      width: 22px;
      height: 24px;
      border: 6px solid #8b949e;
      border-bottom: 0;
      border-radius: 14px 14px 0 0;
    }
    .lock::after {
      content: "";
      position: absolute;
      left: 21px;
      top: 12px;
      width: 6px;
      height: 13px;
      border-radius: 5px;
      background: #111;
    }
    h1 { margin: 0 0 10px; font-size: 22px; line-height: 1.3; }
    p { margin: 0 auto 24px; max-width: 440px; color: #65676b; font-size: 15px; line-height: 1.55; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 190px;
      min-height: 44px;
      padding: 10px 22px;
      border-radius: 7px;
      background: #086f83;
      color: white;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 5px 14px rgba(8, 111, 131, .18);
    }
    a:hover { background: #065e70; }
  </style>
</head>
<body>
  <main>
    <div class="file-lock" aria-hidden="true">
      <span class="file"></span>
      <span class="lock"></span>
    </div>
    <h1>B&#7841;n kh&#244;ng th&#7875; xem n&#7897;i dung n&#224;y</h1>
    <p>N&#7897;i dung &#273;&#432;&#7907;c b&#7843;o v&#7879; ho&#7863;c &#273;&#432;&#7901;ng d&#7851;n kh&#244;ng &#273;&#432;&#7907;c ph&#233;p truy c&#7853;p tr&#7921;c ti&#7871;p. Vui l&#242;ng quay l&#7841;i trang ch&#237;nh v&#224; &#273;&#259;ng nh&#7853;p &#273;&#7875; ti&#7871;p t&#7909;c.</p>
    <a href="/">&#272;i &#273;&#7871;n trang &#273;&#259;ng nh&#7853;p</a>
  </main>
</body>
</html>
